name: Metrics Snapshot

on:
  schedule:
    - cron: "0 0 * * *"  # todos os dias à meia-noite
  workflow_dispatch:      # permite correr manualmente

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          node scripts/snapshot.js

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scripts/data/
          git commit -m "update metrics" || echo "no changes"
          git push https://x-access-token:${{ secrets.MY_PAT }}@github.com/${{ github.repository }}.git HEAD:main